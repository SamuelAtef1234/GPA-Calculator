<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="css/all.min.css">
        <link rel="stylesheet" href="css/normilaze.css">
        <link rel="stylesheet" href="css/style.css">
        <title>GPA Calculator</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    </head>
    <body>

        <div class="container">
            <div class="boxs">
                <div class="box">
                    <h3>Your <span class="GPA-num">1</span> GPA</h3>
                    <input type="number" name="num1" id="num1" class="num"  placeholder="Your GPA">
                    <input type="number" name="gpa1" id="gpa1" class="gpa"  placeholder="The Total GPA">
                </div>
                <div class="box">
                    <h3>Your <span class="GPA-num">2</span> GPA</h3>
                    <input type="number" name="num2" id="num2" class="num"  placeholder="Your GPA">
                    <input type="number" name="gpa2" id="gpa2" class="gpa"  placeholder="The Total GPA">
                </div>
                <div class="box">
                    <h3>Your <span class="GPA-num">3</span> GPA</h3>
                    <input type="number" name="num3" id="num3" class="num"  placeholder="Your GPA">
                    <input type="number" name="gpa3" id="gpa3" class="gpa"  placeholder="The Total GPA">
                </div>
                <div class="box">
                    <h3>Your <span class="GPA-num">4</span> GPA</h3>
                    <input type="number" name="num4" id="num4" class="num"  placeholder="Your GPA">
                    <input type="number" name="gpa4" id="gpa4" class="gpa"  placeholder="The Total GPA">
                </div>
                <div class="box">
                    <h3>Your <span class="GPA-num">5</span> GPA</h3>
                    <input type="number" name="num5" id="num5" class="num"  placeholder="Your GPA">
                    <input type="number" name="gpa5" id="gpa5" class="gpa"  placeholder="The Total GPA">
                </div>
            </div>
            <div class="buttons">
                <button id="btn-res">Show GPA</button>
                <button id="btn-add">Add GPA</button>
            </div>
            <div class="result">
                <h2>The Result</h2>
                <p id="res">2000</p>
            </div>
        </div>
        
        <script src="JavaS/main.js"></script>
    </body>
</html>
